name: ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl-dev libegl-dev

      - name: build shared library (${{ matrix.compiler }})
        run: |
          make CC=${{ matrix.compiler }} clean all

      - name: run unit test suite (${{ matrix.compiler }})
        run: |
          make CC=${{ matrix.compiler }} test

      - name: verify binary output
        run: |
          test -f libvsr.so
          ls -lh libvsr.so
